[package]
name = "grino-relay"
version = "0.1.0"
edition = "2021"
description = "Tiny pub/sub relay (ntfy-compatible subset + WebSocket) for the team #27 pitch deck remote"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "process"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
