<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FeederCheck Calculator</title>
<style>
:root{--bg:#f6f8f9;--card:#fff;--ink:#14202a;--muted:#5b6b76;--line:#d7dee3;--accent:#0d5f6c;--ok:#2e7d32;--warn:#c62828;--hi:#1565c0;--band:#e3f2e5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1519;--card:#172026;--ink:#e6edf1;--muted:#9fb0ba;--line:#2a363e;--accent:#5fc3d1;--ok:#81c784;--warn:#ef9a9a;--hi:#90caf9;--band:#1d3324}}
:root[data-theme="dark"]{--bg:#0f1519;--card:#172026;--ink:#e6edf1;--muted:#9fb0ba;--line:#2a363e;--accent:#5fc3d1;--ok:#81c784;--warn:#ef9a9a;--hi:#90caf9;--band:#1d3324}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:16px 16px 4px;max-width:1240px;margin:0 auto;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:21px;color:var(--accent)}header p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:900px}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
.lang button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
main{max-width:1240px;margin:0 auto;padding:10px 16px 20px;display:grid;grid-template-columns:330px 1fr;gap:14px}
@media (max-width:880px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
label{display:block;font-size:13px;color:var(--muted);margin:9px 0 3px}
input[type=range]{width:100%}select,input[type=number]{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}.val{float:right;color:var(--ink);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--muted)}
.bad{color:var(--warn)}.good{color:var(--ok)}
canvas{width:100%;height:auto;display:block}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600}
tr.best td{background:color-mix(in srgb,var(--ok) 16%,transparent)}
tr.sel td{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.rec{font-size:15px;padding:10px 12px;border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:6px;margin-bottom:12px}
.obs{font-size:13px;padding:8px 10px;border:1px dashed var(--line);border-radius:6px;margin-top:10px;color:var(--muted);display:none}
footer{max-width:1240px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px}
.toggle{display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:13px}
.full{grid-column:1/-1}
button.load{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:5px;padding:2px 8px;cursor:pointer;font:inherit;font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.filters select{width:auto}
</style>
</head>
<body>
<header>
  <div><h1 data-i="title"></h1><p data-i="sub"></p></div>
  <div class="lang"><button data-l="en">EN</button> <button data-l="hy">ՀՅ</button> <button data-l="ru">RU</button></div>
</header>
<main>
  <section class="card">
    <h2 data-i="feeder"></h2>
    <label><span data-i="season"></span><select id="season"><option value="jun" data-i="jun"></option><option value="dec" data-i="dec"></option></select></label>
    <label><span data-i="vmv"></span> <span class="val" id="vmv_v"></span><input type="range" id="vmv" min="0.95" max="1.07" step="0.005" value="1.025"></label>
    <div class="row">
      <label><span data-i="trafo"></span><select id="trafo"><option value="0.16">160 kVA</option><option value="0.25" selected>250 kVA</option><option value="0.4">400 kVA</option><option value="0.63">630 kVA</option></select></label>
      <label><span data-i="tap"></span><select id="tap"><option value="-2">−2 (+5%)</option><option value="-1">−1 (+2.5%)</option><option value="0" selected>0</option><option value="1">+1 (−2.5%)</option><option value="2">+2 (−5%)</option></select></label>
    </div>
    <label><span data-i="cond"></span><select id="cond"></select></label>
    <label><span data-i="len"></span> <span class="val" id="len_v"></span><input type="range" id="len" min="200" max="2000" step="50" value="1000"></label>
    <label><span data-i="hh"></span> <span class="val" id="hh_v"></span><input type="range" id="hh" min="5" max="400" step="5" value="40"></label>
    <label><span data-i="rest"></span> <span class="val" id="rest_v"></span><input type="range" id="rest" min="0" max="500" step="10" value="60"></label>
    <h2 style="margin-top:16px" data-i="solar"></h2>
    <label><span data-i="pv"></span> <span class="val" id="pv_v"></span><input type="range" id="pv" min="0" max="300" step="2" value="48"></label>
    <div class="toggle"><input type="checkbox" id="qu"><label for="qu" style="margin:0;color:var(--ink)" data-i="qu"></label></div>
    <div class="obs" id="obs"></div>
  </section>
  <section>
    <div class="kpis">
      <div class="kpi"><b id="k_hours">–</b><span data-i="k_hours"></span></div>
      <div class="kpi"><b id="k_vmax">–</b><span data-i="k_vmax"></span></div>
      <div class="kpi"><b id="k_vmin">–</b><span data-i="k_vmin"></span></div>
      <div class="kpi"><b id="k_risk">–</b><span data-i="k_risk"></span></div>
      <div class="kpi"><b id="k_hc">–</b><span data-i="k_hc"></span></div>
      <div class="kpi"><b id="k_loss">–</b><span data-i="k_loss"></span></div>
    </div>
    <div class="rec" id="rec">–</div>
    <div class="card"><h2 data-i="chart"></h2><canvas id="chart" width="900" height="300"></canvas>
      <div style="font-size:12px;color:var(--muted)" data-i="legend"></div></div>
    <div class="card" style="margin-top:14px"><h2 data-i="opts"></h2>
      <div class="tw"><table id="opts"><thead><tr><th data-i="o_opt"></th><th data-i="o_cost"></th><th data-i="o_out"></th><th data-i="o_vmax"></th><th data-i="o_vmin"></th><th data-i="o_risk"></th><th data-i="o_hc"></th></tr></thead><tbody></tbody></table></div></div>
  </section>
  <section class="card full">
    <h2 data-i="list"></h2>
    <div style="font-size:13px;color:var(--muted);margin-bottom:8px" data-i="list_note"></div>
    <div class="filters"><select id="f_type"></select><select id="f_mz"></select></div>
    <div class="tw"><table id="feeders"><thead><tr><th data-i="l_mz"></th><th data-i="l_np"></th><th data-i="l_tp"></th><th data-i="l_n"></th><th data-i="l_type"></th><th data-i="l_noon"></th><th data-i="l_night"></th><th data-i="l_eve"></th><th></th></tr></thead><tbody></tbody></table></div>
  </section>
</main>
<footer data-i="foot"></footer>
<script>
const FEEDERS=__FEEDERS__;
const I18N={
en:{title:"FeederCheck — feeder voltage & rooftop-solar hosting calculator",
 sub:"Team Grino #27 · GreenTech Academy Hackathon 2026 · one 0.4 kV feeder of a 10/0.4 kV substation (TP), 24 hours, limits 220 V ±10% (198–242 V, GOST 32144-2013)",
 feeder:"Feeder",season:"Season (clear day)",jun:"June",dec:"December",vmv:"10 kV voltage at the TP, p.u.",trafo:"TP transformer",tap:"Tap position",cond:"Conductor",
 len:"Feeder length, m",hh:"Households on this feeder",rest:"Households on other feeders of this TP",solar:"Rooftop solar",pv:"Solar on this feeder, kWp",
 qu:"Inverters absorb reactive power above 1.05 p.u. (volt-var, cos φ 0.9)",
 k_hours:"hours outside 198–242 V",k_vmax:"highest customer voltage",k_vmin:"lowest customer voltage",k_risk:"solar energy produced above 242 V (risk of inverter trips)",
 k_hc:"solar this feeder can take without >242 V (current settings)",k_loss:"line + transformer losses, kWh/day",
 chart:"Voltage at customers over the day",legend:"Red — lowest voltage on the feeder, blue — highest; green band — 198–242 V.",
 opts:"Cheapest fix first: all options for this feeder",o_opt:"Option",o_cost:"Cost",o_out:"Hours out",o_vmax:"Max V",o_vmin:"Min V",o_risk:"Solar at risk",o_hc:"Hosting, kWp",
 cost:["none","crew: change tap","inverter setting","tap + inverter setting"],vv:"volt-var",
 ok:(hc)=>`<b>Within limits all day.</b> This feeder can take about <b>${hc} kWp</b> of rooftop solar with the current settings.`,
 fix:(o,c,a,h1,h2)=>`<b>Cheapest fix: ${o}</b> (${c}). Hours outside 198–242 V: ${a} → 0. Solar this feeder can take: ${h1} → ${h2} kWp.`,
 none:(n)=>`<b>No setting fixes this feeder</b> (best option still has ${n} hours outside the limits). This is a line-capacity problem: reinforce the conductor, shorten or split the feeder, or limit export. Try a thicker conductor.`,
 list:"Real feeders with voltage problems — PSRC open database (December 2025, June 2026)",
 list_note:"Top 400 feeders (≥20 customers) by customers affected. Hours = hours per month in that band and time block. Line length and installed solar are not in open data (ENA has them) — set them by hand after loading a feeder.",
 l_mz:"Marz / branch",l_np:"Settlement",l_tp:"TP / feeder",l_n:"Customers",l_type:"Type",l_noon:"Jun 9–13 h: >+10%, h",l_night:"Dec 1–8 h: >+10%, h",l_eve:"Dec 19–24 h: <−10%, h",load:"Load",
 all_t:"All types",all_m:"All marzes",types:{solar:"solar (midday)",tap:"tap / always high",overload:"overload (evening)","solar+overload":"solar + overload"},
 obs:(r)=>`Observed in PSRC data for ${r.tp} / ${r.f}: June 9–13 h above +10% — ${r.noonH} h; December 1–8 h above +10% — ${r.nightH} h; December 19–24 h below −10% — ${r.eveL} h. Customers: ${r.n}.`,
 assume:"<i>Assumptions on load (not in open data — change them). PSRC 2025 network averages: 1,135,537 customers, 9,975 TPs 10(6)/0.4 kV, 17,280 km of 0.4 kV lines → 114 customers and 1.73 km of 0.4 kV line per TP; autonomous solar 640 MW at 50,059 sites → 0.56 kW per customer. So: other feeders of the TP = marz average customers per TP minus this feeder; line 500 m in a city, 900 m in a village (1.73 km per TP over ~2 lines); solar 0.56 kW per customer (×2 on solar-type feeders); 10 kV at 1.05 p.u. on always-high feeders.</i>",
 foot:"Method: per-phase backward/forward sweep on the 0.4 kV feeder (5 equal sections, load and solar spread evenly), standard 10/0.4 kV transformer data (u<sub>k</sub> 4%), 0.4 kV secondary on a 0.38 kV network, tap ±2.5% per step on the 10 kV side. Consumption per household: PSRC voltage-database medians (281 kWh/month in December, 174 in June); hourly shapes and the clear-day solar profile are assumptions; cos φ 0.95. Cross-checked against a pandapower model of the same feeder (agreement within 0.1 V). Illustrative engineering estimate, not a measurement of a real ENA feeder — a pilot would use ENA meter data. Volt-var is a setting most modern inverters already have; it needs no new hardware."},
hy:{title:"FeederCheck — ֆիդերի լարման և տանիքային արևային կայանների ընդունման հաշվիչ",
 sub:"Թիմ Grino №27 · GreenTech Academy Hackathon 2026 · 10/0,4 կՎ ենթակայանի (ՏՊ) մեկ 0,4 կՎ ֆիդեր, 24 ժամ, թույլատրելի տիրույթ՝ 220 Վ ±10% (198–242 Վ, ԳՕՍՏ 32144-2013)",
 feeder:"Ֆիդեր",season:"Սեզոն (պարզ օր)",jun:"Հունիս",dec:"Դեկտեմբեր",vmv:"10 կՎ լարումը ՏՊ-ում, հ.մ.",trafo:"ՏՊ-ի տրանսֆորմատոր",tap:"Ճյուղավորման դիրք",cond:"Հաղորդալար",
 len:"Ֆիդերի երկարություն, մ",hh:"Տնային տնտեսություններ այս ֆիդերում",rest:"Տնային տնտեսություններ ՏՊ-ի մյուս ֆիդերներում",solar:"Տանիքային արևային կայաններ",pv:"Արևային հզորություն այս ֆիդերում, կՎտp",
 qu:"Ինվերտորները կլանում են ռեակտիվ հզորություն 1,05 հ.մ.-ից բարձր լարման դեպքում (volt-var, cos φ 0,9)",
 k_hours:"ժամ 198–242 Վ տիրույթից դուրս",k_vmax:"ամենաբարձր լարումը սպառողի մոտ",k_vmin:"ամենացածր լարումը սպառողի մոտ",k_risk:"արևային արտադրանքի մասը 242 Վ-ից բարձր լարման ժամերին (ինվերտորների անջատման ռիսկ)",
 k_hc:"որքան արևային հզորություն կընդունի ֆիդերը առանց >242 Վ (ընթացիկ կարգավորումներով)",k_loss:"կորուստներ գծում և տրանսֆորմատորում, կՎտժ/օր",
 chart:"Լարումը սպառողների մոտ օրվա ընթացքում",legend:"Կարմիր՝ ֆիդերի ամենացածր լարումը, կապույտ՝ ամենաբարձրը, կանաչ շերտ՝ 198–242 Վ։",
 opts:"Սկզբում ամենաէժան լուծումը. բոլոր տարբերակները այս ֆիդերի համար",o_opt:"Տարբերակ",o_cost:"Արժեք",o_out:"Ժամ դուրս",o_vmax:"Առավ. Վ",o_vmin:"Նվազ. Վ",o_risk:"Ռիսկի տակ",o_hc:"Ընդունում, կՎտp",
 cost:["ոչինչ","բրիգադ՝ ճյուղավորման փոփոխություն","ինվերտորի կարգավորում","ճյուղավորում + ինվերտորի կարգավորում"],vv:"volt-var",
 ok:(hc)=>`<b>Ամբողջ օրը լարումը նորմայի մեջ է։</b> Այս ֆիդերը ընթացիկ կարգավորումներով կընդունի մոտ <b>${hc} կՎտp</b> տանիքային արևային հզորություն։`,
 fix:(o,c,a,h1,h2)=>`<b>Ամենաէժան լուծումը՝ ${o}</b> (${c})։ Ժամեր 198–242 Վ-ից դուրս՝ ${a} → 0։ Ֆիդերի ընդունած արևային հզորությունը՝ ${h1} → ${h2} կՎտp։`,
 none:(n)=>`<b>Ոչ մի կարգավորում չի լուծում խնդիրը</b> (լավագույն տարբերակում դեռ ${n} ժամ է նորմայից դուրս)։ Սա գծի թողունակության խնդիր է՝ պետք է ուժեղացնել հաղորդալարը, կարճացնել կամ բաժանել ֆիդերը կամ սահմանափակել ցանց տրվող հզորությունը։`,
 list:"Իրական ֆիդերներ լարման խնդիրներով — ՀԾԿՀ-ի բաց տվյալներ (2025 դեկտեմբեր, 2026 հունիս)",
 list_note:"Առաջին 400 ֆիդերը (≥20 սպառող)՝ ըստ տուժած սպառողների թվի։ Ժամեր՝ ամսական ժամերը տվյալ տիրույթում և ժամային բլոկում։ Գծի երկարությունը և արևային հզորությունը բաց տվյալներում չկան (ՀԷՑ-ն ունի)՝ ֆիդերը բացելուց հետո սահմանեք ձեռքով։",
 l_mz:"Մարզ / մասնաճյուղ",l_np:"Բնակավայր",l_tp:"ՏՊ / ֆիդեր",l_n:"Սպառողներ",l_type:"Տեսակ",l_noon:"Հունիս 9–13՝ >+10%, ժ",l_night:"Դեկտ. 1–8՝ >+10%, ժ",l_eve:"Դեկտ. 19–24՝ <−10%, ժ",load:"Բացել",

const MZ={"Երևան":["Yerevan","Ереван"],"Արագածոտն":["Aragatsotn","Арагацотн"],"Արարատ":["Ararat","Арарат"],"Արմավիր":["Armavir","Армавир"],"Գեղարքունիք":["Gegharkunik","Гегаркуник"],"Լոռի":["Lori","Лори"],"Կոտայք":["Kotayk","Котайк"],"Շիրակ":["Shirak","Ширак"],"Սյունիք":["Syunik","Сюник"],"Վայոց ձոր":["Vayots Dzor","Вайоц Дзор"],"Տավուշ":["Tavush","Тавуш"]};
const COND={"AL 50 mm² overhead (AC-50)":[0.5939,0.30],"AL 95 mm² overhead (AC-95)":[0.306,0.29],"SIP 4×70 (typical)":[0.443,0.08],"Cable 4×150 Al (typical)":[0.208,0.08]};
const TR={0.16:[4.0,1.45],0.25:[4.0,1.2],0.4:[4.0,1.325],0.63:[4.0,1.206]};
const H=[...Array(24).keys()];
function norm(a){const m=a.reduce((s,x)=>s+x,0)/a.length;return a.map(x=>x/m)}
const RES={dec:norm([.55,.5,.48,.47,.48,.55,.75,.95,.9,.8,.75,.72,.72,.7,.7,.75,.9,1.2,1.55,1.75,1.8,1.6,1.2,.8]),
           jun:norm([.6,.55,.5,.48,.48,.5,.6,.75,.8,.85,.95,1.05,1.15,1.2,1.2,1.15,1.1,1.15,1.3,1.5,1.6,1.45,1.1,.8])};
const PV={jun:H.map(h=>Math.pow(Math.max(Math.sin((h-5.5)/14*Math.PI),0),1.3)*0.82),dec:H.map(h=>Math.pow(Math.max(Math.sin((h-8)/9*Math.PI),0),1.3)*0.55)};
const KWH={dec:281/31,jun:174/30};
const N=5, ZB=0.38*0.38/1.0;
const c=(re,im=0)=>({re,im}),add=(a,b)=>c(a.re+b.re,a.im+b.im),sub=(a,b)=>c(a.re-b.re,a.im-b.im),
 mul=(a,b)=>c(a.re*b.re-a.im*b.im,a.re*b.im+a.im*b.re),div=(a,b)=>{const d=b.re*b.re+b.im*b.im;return c((a.re*b.re+a.im*b.im)/d,(a.im*b.re-a.re*b.im)/d)},
 conj=a=>c(a.re,-a.im),abs=a=>Math.hypot(a.re,a.im);
function sweep(p,S){
  const [vk,vkr]=TR[p.trafo], sn=p.trafo;
  const zt=c(vkr/100*0.16/sn/ZB, Math.sqrt(vk*vk-vkr*vkr)/100*0.16/sn/ZB);
  const [r,x]=COND[p.cond]; const L=p.len/1000/N; const zl=c(r*L/ZB,x*L/ZB);
  const E=c(p.vmv*(0.4/0.38)/(1+0.025*p.tap));
  let V=Array(N+1).fill(0).map(()=>c(E.re)); let I=[],Ib=[];
  for(let it=0;it<40;it++){
    I=S.map((s,k)=>conj(div(s,V[k])));
    Ib=Array(N+1); let acc=c(0); for(let k=N;k>=1;k--){acc=add(acc,I[k]);Ib[k]=acc}
    const It=add(acc,I[0]);
    const nV=[sub(E,mul(zt,It))];
    for(let k=1;k<=N;k++) nV[k]=sub(nV[k-1],mul(zl,Ib[k]));
    let d=0; for(let k=0;k<=N;k++) d=Math.max(d,abs(sub(nV[k],V[k]))); V=nV; if(d<1e-7)break;
  }
  let pl=0; for(let k=1;k<=N;k++) pl+=abs(Ib[k])**2*zl.re;
  pl+=abs(add(Ib[1],I[0]))**2*zt.re;
  return {V:V.map(abs),loss:pl};
}
function hour(p,h,qu){
  const loadHH=p.hh*KWH[p.season]/24*RES[p.season][h]/1000, loadRest=p.rest*KWH[p.season]/24*RES[p.season][h]/1000;
  const pv=p.pv*PV[p.season][h]/1000;
  const mk=(q)=>{const S=[c(loadRest,loadRest*0.33)];for(let k=1;k<=N;k++){const pl=loadHH/N, pg=pv/N;S.push(c(pl-pg,pl*0.33-(q[k]||0)))}return S};
  let q=Array(N+1).fill(0); let res=sweep(p,mk(q));
  if(qu && pv>0){let any=false;for(let k=1;k<=N;k++) if(res.V[k]>1.05){q[k]=-(pv/N)*0.484;any=true}
    if(any) res=sweep(p,mk(q));}
  return {...res,pv};
}
function day(p,qu){
  let out=0,vmax=0,vmin=9,risk=0,pvE=0,loss=0,curves=[];
  for(const h of H){const r=hour(p,h,qu);const lv=r.V.slice(1);const mx=Math.max(...lv,r.V[0]),mn=Math.min(...lv);
    curves.push([mn,mx]); if(mx>1.10||mn<0.90) out++; vmax=Math.max(vmax,mx); vmin=Math.min(vmin,mn);
    pvE+=r.pv; if(mx>1.10) risk+=r.pv; loss+=r.loss;}
  return {out,vmax,vmin,risk:pvE>0?risk/pvE:0,loss:loss*1000,curves};
}
function hosting(p,qu){
  const ok=k=>day({...p,pv:k},qu).vmax<=1.10;
  if(!ok(0))return 0; let lo=0,hi=1500; if(ok(hi))return hi;
  for(let i=0;i<16;i++){const m=(lo+hi)/2; if(ok(m))lo=m;else hi=m} return lo;
}
const $=id=>document.getElementById(id);
let LANG="en"; try{const s=localStorage.getItem("fc_lang"); if(s&&I18N[s])LANG=s}catch(e){}
const T=k=>I18N[LANG][k];
for(const k of Object.keys(COND)){const o=document.createElement('option');o.textContent=k;$('cond').appendChild(o)}
function params(){return {season:$('season').value,vmv:+$('vmv').value,trafo:+$('trafo').value,tap:+$('tap').value,cond:$('cond').value,len:+$('len').value,hh:+$('hh').value,rest:+$('rest').value,pv:+$('pv').value}}
const V=x=>Math.round(x*220)+(LANG==="hy"?" Վ":LANG==="ru"?" В":" V");
function draw(curves){
  const cv=$('chart'),g=cv.getContext('2d'),W=cv.width,Hh=cv.height,pad=40;
  const css=getComputedStyle(document.documentElement);g.clearRect(0,0,W,Hh);
  const y=v=>Hh-pad-(v*220-180)/(270-180)*(Hh-2*pad), x=h=>pad+h/23*(W-2*pad);
  g.fillStyle=css.getPropertyValue('--band');g.fillRect(pad,y(242/220),W-2*pad,y(198/220)-y(242/220));
  g.strokeStyle=css.getPropertyValue('--line');g.fillStyle=css.getPropertyValue('--muted');g.font='12px system-ui';g.lineWidth=1;
  for(let v=180;v<=270;v+=15){g.beginPath();g.moveTo(pad,y(v/220));g.lineTo(W-pad,y(v/220));g.stroke();g.fillText(v,4,y(v/220)+4)}
  for(let h=0;h<24;h+=3)g.fillText(h+':00',x(h)-12,Hh-pad+16);
  [[0,'--warn'],[1,'--hi']].forEach(([i,col])=>{g.strokeStyle=css.getPropertyValue(col);g.lineWidth=2.5;g.beginPath();curves.forEach((cv,h)=>{h?g.lineTo(x(h),y(cv[i])):g.moveTo(x(h),y(cv[i]))});g.stroke()});
}
function optName(o){return `tap ${o.tap>0?'+':''}${o.tap}${o.q?' + '+T('vv'):''}`}
function run(){
  const p=params();
  $('vmv_v').textContent=p.vmv.toFixed(3);$('len_v').textContent=p.len;$('hh_v').textContent=p.hh;$('rest_v').textContent=p.rest;$('pv_v').textContent=p.pv;
  const qu=$('qu').checked, d=day(p,qu), hc0=Math.round(hosting(p,qu));
  $('k_hours').textContent=d.out;$('k_hours').className=d.out?'bad':'good';
  $('k_vmax').textContent=V(d.vmax);$('k_vmax').className=d.vmax>1.10?'bad':'good';
  $('k_vmin').textContent=V(d.vmin);$('k_vmin').className=d.vmin<0.90?'bad':'good';
  $('k_risk').textContent=Math.round(d.risk*100)+'%';$('k_hc').textContent=hc0+(LANG==="ru"?" кВт":LANG==="hy"?" կՎտp":" kWp");
  $('k_loss').textContent=d.loss.toFixed(1); draw(d.curves);
  const rows=[];
  for(const tap of [-2,-1,0,1,2])for(const q of [false,true]){const pp={...p,tap};rows.push({tap,q,cost:(tap!==p.tap?1:0)+(q?2:0),r:day(pp,q),hc:hosting(pp,q)})}
  rows.sort((a,b)=>a.cost-b.cost||a.r.out-b.r.out);
  const best=rows.find(o=>o.r.out===0);
  const tb=$('opts').querySelector('tbody');tb.innerHTML='';
  rows.forEach(o=>{const tr=document.createElement('tr');if(o===best)tr.className='best';
    tr.innerHTML=`<td>${optName(o)}</td><td>${T('cost')[o.cost]}</td><td>${o.r.out}</td><td>${V(o.r.vmax)}</td><td>${V(o.r.vmin)}</td><td>${Math.round(o.r.risk*100)}%</td><td>${Math.round(o.hc)}</td>`;tb.appendChild(tr)});
  if(d.out===0) $('rec').innerHTML=T('ok')(hc0);
  else if(best) $('rec').innerHTML=T('fix')(optName(best),T('cost')[best.cost],d.out,hc0,Math.round(best.hc));
  else $('rec').innerHTML=T('none')(Math.min(...rows.map(o=>o.r.out)));
}
function applyAssumptions(r){
  // Open data has customers per feeder and observed hours only. Line, TP and solar: PSRC 2025 network averages (see note).
  const CPT={"Երևան":161,"Կոտայք":125,"Լոռի":109,"Շիրակ":82,"Արարատ":104,"Արմավիր":96,"Գեղարքունիք":94,"Սյունիք":100,"Տավուշ":100,"Արագածոտն":72,"Վայոց ձոր":69};
  const city=r.np.startsWith('ք.'), n=Math.min(400,Math.max(5,Math.round(r.n/5)*5));
  const rest=Math.min(500,Math.max(0,Math.round(((CPT[r.mz]||114)-n)/10)*10));
  const keys=Object.keys(COND);
  $('hh').value=n; $('rest').value=rest;
  $('len').value=city?500:900;
  $('cond').value=city?(n>120?keys[3]:keys[1]):(n>80?keys[1]:keys[0]);
  const tot=n+rest; $('trafo').value=tot<=120?'0.16':tot<=250?'0.25':tot<=450?'0.4':'0.63';
  $('tap').value='0'; $('qu').checked=false;
  $('vmv').value=r.type.startsWith('tap')?'1.05':'1.025';
  $('pv').value=Math.min(300,Math.round(n*(r.type.startsWith('solar')?1.12:0.56)/2)*2);
  $('season').value=r.type.startsWith('solar')?'jun':(r.type==='tap'?'jun':'dec');
}
let SEL=null;
function mzName(m){return LANG==="hy"?m:(MZ[m]?MZ[m][LANG==="ru"?1:0]:m)}
function renderList(){
  const ft=$('f_type').value, fm=$('f_mz').value, tb=$('feeders').querySelector('tbody'); tb.innerHTML='';
  FEEDERS.filter(r=>(!ft||r.type===ft)&&(!fm||r.mz===fm)).slice(0,200).forEach((r,i)=>{
    const tr=document.createElement('tr'); if(SEL===r)tr.className='sel';
    tr.innerHTML=`<td>${mzName(r.mz)} / ${r.br}</td><td>${r.np}</td><td>${r.tp} / ${r.f}</td><td>${r.n}</td><td>${T('types')[r.type]||r.type}</td><td>${r.noonH}</td><td>${r.nightH}</td><td>${r.eveL}</td><td><button class="load">${T('load')}</button></td>`;
    tr.querySelector('button').onclick=()=>{SEL=r; applyAssumptions(r);
      $('obs').style.display='block'; $('obs').innerHTML=T('obs')(r)+'<br>'+T('assume'); run(); renderList(); window.scrollTo({top:0,behavior:'smooth'})};
    tb.appendChild(tr)});
}
function fillFilters(){
  const ft=$('f_type'), fm=$('f_mz'), vt=ft.value, vm=fm.value;
  ft.innerHTML=`<option value="">${T('all_t')}</option>`+Object.keys(I18N.en.types).map(k=>`<option value="${k}">${T('types')[k]}</option>`).join('');
  const mzs=[...new Set(FEEDERS.map(r=>r.mz))].sort((a,b)=>mzName(a).localeCompare(mzName(b)));
  fm.innerHTML=`<option value="">${T('all_m')}</option>`+mzs.map(m=>`<option value="${m}">${mzName(m)}</option>`).join('');
  ft.value=vt; fm.value=vm;
}
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=T(e.dataset.i); if(typeof v==='string') e.innerHTML=v});
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  fillFilters(); renderList(); if(SEL){$('obs').innerHTML=T('obs')(SEL)+'<br>'+T('assume')} run();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem("fc_lang",LANG)}catch(e){}applyLang()});
document.querySelectorAll('#inputs input, main input, main select').forEach(e=>{ if(e.id==='f_type'||e.id==='f_mz') return; e.addEventListener('input',run)});
$('f_type').addEventListener('input',renderList); $('f_mz').addEventListener('input',renderList);
applyLang();
</script>
</body>
</html>
